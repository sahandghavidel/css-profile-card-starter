<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sahand · Profile card</title>
  <link rel="stylesheet" href="starter.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="card" aria-labelledby="name">
      <div class="banner"></div>
      <div class="content">
        <img class="portrait" src="sahand.png" width="112" height="112" alt="Portrait of Sahand">
        <h1 id="name">Hello, I’m Sahand</h1>
        <p>I help beginners build their first websites.</p>
        <ul class="skills" aria-label="Skills">
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
        <button class="button" type="button">
          Explore tutorials
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </article>
  </main>
</body>
</html>
